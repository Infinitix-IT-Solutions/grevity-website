  <!-- Headline wraps to three lines so it clears the pendrive art at x=792. -->
  <text x="88" y="248" fill="#FFFFFF" font-size="64" font-weight="bold" letter-spacing="-2">Your Whole</text>
  <text x="88" y="318" fill="#FFFFFF" font-size="64" font-weight="bold" letter-spacing="-2">Business. On</text>
  <text x="88" y="388" fill="#a5b4fc" font-size="64" font-weight="bold" letter-spacing="-2">One Pendrive.</text>

  <text x="88" y="448" fill="#cbd5e1" font-size="27">Offline GST billing, inventory &amp; production software</text>
  <text x="88" y="484" fill="#cbd5e1" font-size="27">for manufacturers, traders and retailers across India.</text>

  <g transform="translate(88,524)" font-size="23" fill="#e2e8f0">
    <rect x="0" y="0" width="180" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="26" y="33">GST Ready</text>
    <rect x="200" y="0" width="290" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="226" y="33">Works Offline (Pendrive)</text>
  </g>

  <!-- The product itself: the licensed Grevity pendrive. -->
  <defs>
    <linearGradient id="pdBody" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#333d5c"/>
      <stop offset="55%" stop-color="#1c2337"/>
      <stop offset="100%" stop-color="#141a2b"/>
    </linearGradient>
    <linearGradient id="pdMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef1f8"/>
      <stop offset="42%" stop-color="#c3cbdd"/>
      <stop offset="58%" stop-color="#98a2ba"/>
      <stop offset="100%" stop-color="#cfd6e6"/>
    </linearGradient>
    <radialGradient id="pdShadow" cx="0.5" cy="0.5">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g transform="translate(800,200)">
    <ellipse cx="168" cy="212" rx="168" ry="26" fill="url(#pdShadow)"/>

    <g transform="rotate(-9 168 120)">
      <!-- lanyard loop -->
      <circle cx="26" cy="120" r="15" fill="none" stroke="url(#pdMetal)" stroke-width="8"/>

      <!-- body -->
      <rect x="34" y="70" width="212" height="100" rx="26" fill="url(#pdBody)" stroke="#7c88ab" stroke-opacity="0.45"/>
      <rect x="42" y="76" width="196" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.10"/>

      <text x="152" y="118" fill="#FFFFFF" font-size="25" font-weight="bold" letter-spacing="6" text-anchor="middle">GREVITY</text>
      <text x="152" y="141" fill="#a5b4fc" font-size="12" letter-spacing="4" text-anchor="middle">OFFLINE EDITION</text>

      <!-- activity LED, kept clear of the wordmark -->
      <circle cx="62" cy="120" r="11" fill="#10b981" fill-opacity="0.28"/>
      <circle cx="62" cy="120" r="5.5" fill="#34d399"/>

      <!-- collar + USB-A connector -->
      <rect x="240" y="78" width="22" height="84" rx="9" fill="url(#pdMetal)"/>
      <rect x="258" y="92" width="76" height="56" rx="7" fill="url(#pdMetal)" stroke="#8792ad" stroke-opacity="0.7"/>
      <rect x="268" y="106" width="56" height="28" rx="4" fill="#0d1220"/>
      <g fill="#d9a441">
        <rect x="274" y="112" width="44" height="4" rx="2"/>
        <rect x="274" y="120" width="44" height="4" rx="2"/>
      </g>
    </g>
  </g>
